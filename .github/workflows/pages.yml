name: Publish book

on:
  push:
    branches: [main]
    paths:
      - 'template/**'
      - 'support/pages/**'
      - 'support/tools/**'
      - 'support/verify/html_book_check.py'
      - 'requirements-pages.txt'
      - 'requirements-print.txt'
      - '.github/workflows/pages.yml'
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'requirements-*.txt'
      - run: python -m pip install -r requirements-pages.txt
      - uses: actions/cache@v4
        id: font
        with:
          path: build/pages-font
          key: maple-mono-nf-cn-v7.9-af913b632290
      - name: Prepare code font
        if: steps.font.outputs.cache-hit != 'true'
        run: |
          mkdir -p build/pages-font
          curl --fail --location --retry 3 \
            https://github.com/subframe7536/maple-font/releases/download/v7.9/MapleMono-NF-CN.zip \
            --output build/maple.zip
          echo 'af913b6322905348b3f50e4397fedc35b3a880db5effcce7969003051dcd3e94  build/maple.zip' | sha256sum --check
          unzip -j build/maple.zip MapleMono-NF-CN-Regular.ttf LICENSE.txt -d build/pages-font
      - uses: actions/cache@v4
        id: text-font
        with:
          path: build/pages-text-font
          key: latin-modern-roman-2.007-math-1.959
      - name: Prepare PDF text fonts
        if: steps.text-font.outputs.cache-hit != 'true'
        run: |
          mkdir -p build/pages-text-font
          curl --fail --location --retry 3 \
            https://www.gust.org.pl/projects/e-foundry/latin-modern/download/Latin_Modern-otf-2_007-31_03_2026.zip \
            --output build/latin-modern.zip
          echo '2d8e05083e211ac838a9e306fb5e4856ed37ec15130e185a971e2683a7c5d1a1  build/latin-modern.zip' | sha256sum --check
          unzip -j build/latin-modern.zip lmroman10-regular.otf -d build/pages-text-font
          curl --fail --location --retry 3 \
            https://mirrors.ctan.org/fonts/lm-math/opentype/latinmodern-math.otf \
            --output build/pages-text-font/latinmodern-math.otf
          curl --fail --location --retry 3 \
            https://www.gust.org.pl/fonts/licenses/GUST-FONT-LICENSE.txt \
            --output build/pages-text-font/GUST-FONT-LICENSE.txt
          echo '6075562b771f8b82f0c179e363389684f2dd09de30038269e2628e504bd7be0f  build/pages-text-font/latinmodern-math.otf' | sha256sum --check
          echo '5eb61bb836bb1845ef668717cb15b382e997748ce2629e4388cc5e4c3fa4e433  build/pages-text-font/GUST-FONT-LICENSE.txt' | sha256sum --check
      - name: Build HTML book
        run: python support/tools/generate_html.py --output dist
      - name: Download latest release PDFs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download --dir dist \
            --pattern template.pdf --pattern oeis-2up.pdf
          for file in template.pdf oeis-2up.pdf; do
            test -s "dist/$file"
          done
      - name: Check HTML and source consistency
        run: python support/verify/html_book_check.py --site dist
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
