site_name: XCPC Template
site_description: 可直接复制的 C++17 XCPC 算法模板库

docs_dir: docs
site_dir: site

theme:
  name: material
  language: zh
  features:
    - navigation.indexes
    - content.code.copy

plugins:
  - search

hooks:
  - tools/generate_docs.py

watch:
  - ds
  - geometry
  - graph
  - math
  - others
  - string
  - README.md

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - toc:
      permalink: true
