<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XCPC Template</title>
<link rel="icon" href="/assets/logo.svg">
<link rel="stylesheet" href="/guestbook/fonts.css">
<meta name="color-scheme" content="light">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; height: 100dvh; font: 13px var(--font-ui, sans-serif); background: #282828; }
  header {
    display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    align-items: center; gap: 16px; flex: none; height: 64px; padding: 0 20px;
    background: white; border-bottom: 1px solid #0000001f;
  }
  a { text-decoration: none; }
  .repo { display: flex; align-items: center; gap: 7px; color: #0066cc; min-width: 0; }
  .repo span, .file { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  nav { display: flex; gap: 4px; }
  nav a { padding: 11px 16px; border-radius: 4px; color: #6e6e73; text-align: center; }
  nav a[aria-current] { color: #1867c0; background: #1867c012; }
  a:focus-visible { outline: 2px solid #0066cc; outline-offset: 2px; }
  .file { justify-self: end; max-width: 100%; font: 12px var(--font-ui, monospace); color: #6e6e73; }
  .file:hover { color: #0066cc; }
  iframe { display: block; flex: 1; width: 100%; min-height: 0; border: 0; }
  @media (max-width: 640px) {
    header { grid-template-columns: auto minmax(0, 1fr); gap: 8px; padding: 0 12px; }
    .repo { display: none; }
    .file { font-size: 10px; }
    nav a { padding: 11px 8px; }
  }
</style>
</head>
<body>
<header>
  <a class="repo" href="https://chzhc.cn/" aria-label="返回主站">
    <span>XCPC Template</span>
  </a>
  <nav aria-label="阅读方式">
    <a href="./">HTML</a>
    <a href="template.pdf" data-tab="template" data-filename="template.pdf" aria-current="page">PDF</a>
    <a href="oeis-2up.pdf" data-tab="oeis" data-filename="oeis-2up.pdf">OEIS</a>
  </nav>
  <a class="file" href="template.pdf" target="_blank" rel="noopener">template.pdf</a>
</header>
<iframe title="Template" src="template.pdf#navpanes=0"></iframe>
<script>
  const tabs = [...document.querySelectorAll("nav a[data-tab]")];
  const file = document.querySelector(".file");
  const viewer = document.querySelector("iframe");
  function show() {
    const tab = tabs.find(t => "#" + t.dataset.tab === location.hash) || tabs[0];
    tabs.forEach(t => t === tab ? t.setAttribute("aria-current", "page") : t.removeAttribute("aria-current"));
    file.href = tab.getAttribute("href");
    file.textContent = tab.dataset.filename;
    viewer.title = tab.textContent;
    const source = tab.getAttribute("href") + "#navpanes=0";
    if (viewer.getAttribute("src") !== source) viewer.src = source;
  }
  tabs.forEach(tab => tab.addEventListener("click", event => {
    event.preventDefault();
    location.hash = tab.dataset.tab;
  }));
  addEventListener("hashchange", show);
  show();
</script>
</body>
</html>
